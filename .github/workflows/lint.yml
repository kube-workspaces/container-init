name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
        # setup-go pins GOTOOLCHAIN=local. This tool needs Go 1.25+, while
        # the application and its compatibility tests intentionally use 1.24.
        env:
          GOTOOLCHAIN: auto
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
        env:
          CGO_ENABLED: "0"
